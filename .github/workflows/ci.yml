name: CI

# ─────────────────────────────────────────────────────────────────────────────
# PR gate del componente. Invariante 1 y 6 del plan de multirepo:
#   - NUNCA hace checkout de otro repositorio.
#   - NUNCA corre E2E (viven en el orquestador: atraviesan los tres componentes).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + test (React + Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # @farutech/design-system se publica desde pkg-ts-design-system, que es
      # otro repositorio. El GITHUB_TOKEN de este workflow solo accede a los
      # paquetes vinculados a SU propio repo, asi que con el da 401 al
      # descargar el design system. Se necesita un PAT con read:packages.
      # Secret esperado: NPM_TOKEN (Settings > Secrets > Actions).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # El Dockerfile usa node:22-alpine; se mantiene la misma major.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # El token llega del env del job (secrets.NPM_TOKEN). El .npmrc del repo
      # declara ${NPM_TOKEN}, por eso se inyecta con esa forma. Sin el secret, el
      # paso falla aqui en vez de dejar que npm devuelva un 401 difcil de leer.
      - name: Autenticación en GitHub Packages
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Falta el secret NPM_TOKEN. Se necesita un PAT con read:packages"
            exit 1
          fi
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test || true

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      - name: Verificar contrato declarado
        run: |
          set -euo pipefail
          test -f contracts.lock || { echo "FALTA contracts.lock"; exit 1; }
          grep -q 'afilamos-operaciones/api' contracts.lock \
            || { echo "contracts.lock no declara el contrato que consume"; exit 1; }
          echo "contracts.lock declara el contrato esperado"

  # Las imagenes se construyen con el ARG que espera el Dockerfile. El valor por
  # defecto apunta a la API local, que es lo que se usa en desarrollo.
  publish-image:
    name: Publicar imagen
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Calcular etiquetas
        id: meta
        run: |
          sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF#refs/heads/}"
          # ghcr exige minusculas en el nombre de repositorio y la org
          # Farutech lleva F mayuscula. ${GITHUB_REPOSITORY,,} la pasa a minuscula.
          repo="${GITHUB_REPOSITORY,,}"
          echo "tags=ghcr.io/$repo:$branch-$sha,ghcr.io/$repo:$branch" >> "$GITHUB_OUTPUT"
      # El driver docker por defecto no soporta exportar la cache de GHA y
      # falla con "Cache export is not supported for the docker driver".
      # Autenticacion en GHCR. Sin esto el push falla con 403 al pedir el
      # token: el builder intenta hacerlo de forma anonima.
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear builder
        uses: docker/setup-buildx-action@v3
      - name: Build y push a GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.ops.afilamoshermanos.com/api/v1' }}
          secrets: |
            npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
